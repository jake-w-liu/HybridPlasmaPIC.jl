name: Implementation essentials

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Existing implementation regressions to run
        required: true
        type: choice
        default: electromagnetic-species
        options:
          - electromagnetic-species
          - collisional-transport
          - particle-accuracy
          - electromagnetic-continuity
          - bounded-fields

permissions:
  contents: read

jobs:
  essentials:
    name: ${{ inputs.suite }} / Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Run existing essential regressions
        shell: bash
        env:
          IMPLEMENTATION_SUITE: ${{ inputs.suite }}
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            if ENV["IMPLEMENTATION_SUITE"] == "bounded-fields"
              Pkg.add("JET")
            end'
          julia --project=. -e '
            using Test
            suites = Dict(
              "electromagnetic-species" => ("test_empic_species.jl", "test_empic_relativistic_species.jl", "test_relativistic_energy_range.jl", "test_empic.jl", "test_empic1d.jl", "test_electrostatic_species_diversity.jl"),
              "collisional-transport" => ("test_collisional_hybrid.jl", "test_collisional_checkpoint.jl", "test_collisional_physics.jl"),
              "particle-accuracy" => ("test_boris_accuracy.jl", "test_relativistic_species_factors.jl", "test_relativistic_output_closure.jl"),
              "electromagnetic-continuity" => ("test_empic_relativistic_species.jl",),
              "bounded-fields" => ("test_yee_particle_charge.jl", "test_bounded_maxwell.jl", "test_sourced_yee.jl", "test_sourced_yee_modes.jl", "test_sourced_yee_additional.jl"),
            )
            println((julia = VERSION, suite = ENV["IMPLEMENTATION_SUITE"]))
            for file in suites[ENV["IMPLEMENTATION_SUITE"]]
              @info "existing regression" file
              include(joinpath("test", file))
            end' 2>&1 | tee implementation-essentials.log
      - name: Retain full test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essentials-${{ inputs.suite }}-${{ matrix.julia-version }}-${{ github.sha }}
          path: implementation-essentials.log
          if-no-files-found: warn
