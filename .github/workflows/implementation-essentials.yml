name: Implementation essentials

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Essential regressions or remote formatting preparation
        required: true
        type: choice
        default: electromagnetic-species
        options:
          - electromagnetic-species
          - persistent-species
          - coupled-empic
          - collisional-transport
          - collisional-cgl
          - electron-ion-thermal
          - particle-accuracy
          - electromagnetic-continuity
          - bounded-fields
          - longitudinal-pic
          - yee-electromagnetic-pic
          - rk4-affine
          - electron-conduction
          - field-aligned-conduction
          - slab-gyrokinetic
          - sheared-hybrid
          - toroidal-annulus
          - implicit-em
          - implicit-hybrid-pressure
          - implicit-yee-em
          - static-composite-es
          - adaptive-composite-es
          - periodic-adaptive-composite-es
          - shared-cuda-scalars
          - completed-clock
          - open-hall-hybrid
          - format-candidate
          - source-representation

permissions:
  contents: read

jobs:
  format-candidate:
    name: Prepare JuliaFormatter patch
    if: ${{ inputs.suite == 'format-candidate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Prepare formatting with the required CI formatter
        shell: bash
        run: |
          julia -e '
            using Pkg
            Pkg.add(PackageSpec(name = "JuliaFormatter", version = "1"))
            using JuliaFormatter
            unchanged = format(".")
            println((julia = VERSION, formatter = Base.pkgversion(JuliaFormatter), input_already_formatted = unchanged))'
          git diff --binary --output=formatter-candidate.patch
          git diff --check
          git diff --stat
      - name: Retain the exact candidate formatting patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatter-candidate-${{ github.sha }}
          path: formatter-candidate.patch
          if-no-files-found: warn

  essentials:
    name: ${{ inputs.suite }} / Julia ${{ matrix.julia-version }}
    if: ${{ inputs.suite != 'format-candidate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Run existing essential regressions
        shell: bash
        env:
          IMPLEMENTATION_SUITE: ${{ inputs.suite }}
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            if ENV["IMPLEMENTATION_SUITE"] in ("bounded-fields", "longitudinal-pic", "yee-electromagnetic-pic", "electron-conduction", "field-aligned-conduction", "source-representation")
              Pkg.add("JET")
            end'
          julia --project=. -e '
            using Test
            suites = Dict(
              "slab-gyrokinetic" => ("test_slab_gyrokinetic.jl",),
              "sheared-hybrid" => ("test_sheared_hybrid.jl",),
              "toroidal-annulus" => ("test_toroidal_annulus_hybrid.jl", "test_fusion.jl"),
              "implicit-em" => ("test_implicit_em.jl", "test_implicit_hybrid_phase.jl"),
              "implicit-hybrid-pressure" => ("test_implicit_hybrid_pressure.jl", "test_implicit_hybrid.jl", "test_implicit_hybrid_phase.jl", "test_scalar_pressure_range.jl", "test_evolving_pressure.jl", "test_evolving_pressure_accuracy.jl", "test_evolving_pressure_energy.jl", "test_transport_electrons.jl", "test_transport_electrons_io.jl", "test_transport_hyperresistivity.jl"),
              "implicit-yee-em" => ("test_implicit_yee_em.jl", "test_implicit_yee_transverse.jl"),
              "static-composite-es" => ("test_static_composite_electrostatic.jl", "test_dynamic_composite_electrostatic.jl"),
              "source-representation" => ("test_static_composite_electrostatic.jl", "test_dynamic_composite_electrostatic.jl", "test_toroidal_annulus_hybrid.jl", "test_jet.jl"),
              "adaptive-composite-es" => ("test_adaptive_composite_electrostatic.jl", "test_static_composite_electrostatic.jl", "test_dynamic_composite_electrostatic.jl"),
              "periodic-adaptive-composite-es" => ("test_periodic_adaptive_composite_electrostatic.jl", "test_adaptive_composite_electrostatic.jl", "test_static_composite_electrostatic.jl", "test_dynamic_composite_electrostatic.jl", "test_implicit_yee_em.jl", "test_implicit_yee_transverse.jl"),
              "shared-cuda-scalars" => ("test_shared_scalar_shapes.jl", "test_moment_normalization.jl", "test_boris_accuracy.jl", "test_rk4_original_duration.jl", "test_ohm_scalar_range.jl", "test_hybrid.jl"),
              "completed-clock" => ("test_step_clocks.jl", "test_io_clock.jl"),
              "open-hall-hybrid" => ("test_open_hall_hybrid.jl",),
              "electromagnetic-species" => ("test_empic_species.jl", "test_empic1d_species.jl", "test_empic_relativistic_species.jl", "test_relativistic_energy_range.jl", "test_empic.jl", "test_empic1d.jl", "test_electrostatic_species_diversity.jl", "test_electrostatic_species.jl"),
              "persistent-species" => ("test_empic_persistent_schedule.jl", "test_empic_species_schedule.jl", "test_empic_species.jl", "test_empic1d_species.jl", "test_empic_relativistic_species.jl"),
              "coupled-empic" => ("test_empic_coupled_error_control.jl", "test_empic_persistent_schedule.jl", "test_empic_species_schedule.jl", "test_empic_species.jl", "test_empic1d_species.jl"),
              "collisional-transport" => ("test_collisional_hybrid.jl", "test_collisional_checkpoint.jl", "test_collisional_physics.jl"),
              "collisional-cgl" => ("test_collisional_cgl.jl", "test_cgl.jl", "test_collisional_hybrid.jl", "test_collisional_checkpoint.jl", "test_electron_ion_thermal_exchange.jl", "test_electron_ion_overlap.jl", "test_collisional_physics.jl"),
              "electron-ion-thermal" => ("test_electron_ion_thermal_exchange.jl", "test_electron_ion_overlap.jl", "test_collisional_hybrid.jl", "test_collisional_checkpoint.jl", "test_collisional_physics.jl"),
              "particle-accuracy" => ("test_boris_accuracy.jl", "test_relativistic_species_factors.jl", "test_relativistic_output_closure.jl"),
              "electromagnetic-continuity" => ("test_empic_relativistic_species.jl",),
              "electron-conduction" => ("test_electron_conduction.jl", "test_evolving_pressure.jl", "test_transport_electrons.jl", "test_transport_electrons_io.jl", "test_transport_hyperresistivity.jl", "test_scalar_pressure_range.jl"),
              "field-aligned-conduction" => ("test_field_aligned_conduction.jl", "test_electron_conduction.jl", "test_transport_electrons_io.jl", "test_scalar_pressure_range.jl", "test_implicit_hybrid_pressure.jl"),
              "yee-electromagnetic-pic" => ("test_yee_electromagnetic_pic.jl", "test_yee_longitudinal_pic.jl", "test_yee_particle_charge.jl", "test_bounded_maxwell.jl", "test_sourced_yee.jl"),
              "longitudinal-pic" => ("test_yee_absorbing_longitudinal_pic.jl", "test_yee_impact_longitudinal_pic.jl", "test_yee_longitudinal_pic.jl", "test_yee_particle_charge.jl", "test_bounded_maxwell.jl", "test_sourced_yee.jl"),
              "rk4-affine" => ("test_rk4_original_duration.jl", "test_rk4_mixed_stability.jl", "test_transport_electrons.jl", "test_phase_helpers.jl"),
              "bounded-fields" => ("test_yee_particle_charge.jl", "test_bounded_maxwell.jl", "test_sourced_yee.jl", "test_sourced_yee_modes.jl", "test_sourced_yee_additional.jl"),
            )
            if ENV["IMPLEMENTATION_SUITE"] == "bounded-fields"
              import JET
              println((julia = VERSION, purpose = :base_indexing_observation, acceptance = false))
              for (label, operation, types) in (
                (:strided_getindex_f32, getindex, Tuple{StridedVector{Float32},Int}),
                (:strided_getindex_f64, getindex, Tuple{StridedVector{Float64},Int}),
                (:range_reindex_without_subindices, Base.reindex, Tuple{Tuple{UnitRange{Int}},Tuple{}}),
              )
                report = JET.report_call(operation, types; sourceinfo = :full, stacktrace_types_limit = 0)
                println((probe = label, input_types = types, possible_errors = length(JET.get_reports(report))))
                show(IOContext(stdout, :limit => false), MIME"text/plain"(), report)
                println()
              end
            end
            if ENV["IMPLEMENTATION_SUITE"] == "yee-electromagnetic-pic"
              include(joinpath("benchmark", "yee_coupled_steps.jl"))
            end
            println((julia = VERSION, suite = ENV["IMPLEMENTATION_SUITE"]))
            @testset verbose = true "Implementation essentials" begin
              for file in suites[ENV["IMPLEMENTATION_SUITE"]]
                @info "existing regression" file
                include(joinpath("test", file))
              end
            end' 2>&1 | tee implementation-essentials.log
      - name: Observe stored-zero context and generated operations
        if: ${{ always() && inputs.suite == 'longitudinal-pic' }}
        shell: bash
        run: |
          julia --project=. benchmark/yee_stored_zero_context_observation.jl 2>&1 | tee yee-stored-zero-context.log
      - name: Retain auxiliary stored-zero observation
        if: ${{ always() && inputs.suite == 'longitudinal-pic' }}
        uses: actions/upload-artifact@v4
        with:
          name: stored-zero-context-${{ matrix.julia-version }}-${{ github.sha }}
          path: |
            yee-stored-zero-context.log
            yee-stored-zero-context/
          if-no-files-found: warn
      - name: Retain full test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essentials-${{ inputs.suite }}-${{ matrix.julia-version }}-${{ github.sha }}
          path: implementation-essentials.log
          if-no-files-found: warn
      - name: Check out pre-pressure schema1 source
        if: ${{ inputs.suite == 'implicit-hybrid-pressure' }}
        uses: actions/checkout@v4
        with:
          ref: b8a5e7d366177a8a667eda9401b2ec996e980370
          path: .hpic-pre-pressure
      - name: Capture old schema1 and continue it with the candidate
        if: ${{ inputs.suite == 'implicit-hybrid-pressure' }}
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          julia --project="$PWD/.hpic-pre-pressure" -e 'using Pkg; Pkg.instantiate()' \
            2>&1 | tee implicit-hybrid-schema1-setup.log
          julia --project="$PWD/.hpic-pre-pressure" tools/ci_implicit_hybrid_schema1.jl \
            write "$RUNNER_TEMP/implicit-hybrid-schema1" "$PWD/.hpic-pre-pressure" \
            2>&1 | tee implicit-hybrid-schema1-write.log
          julia --project=. tools/ci_implicit_hybrid_schema1.jl \
            check "$RUNNER_TEMP/implicit-hybrid-schema1" "$PWD" \
            2>&1 | tee implicit-hybrid-schema1-check.log
      - name: Retain historical schema1 observations
        if: ${{ always() && inputs.suite == 'implicit-hybrid-pressure' }}
        uses: actions/upload-artifact@v4
        with:
          name: implicit-hybrid-schema1-${{ matrix.julia-version }}-${{ github.sha }}
          path: |
            implicit-hybrid-schema1-setup.log
            implicit-hybrid-schema1-write.log
            implicit-hybrid-schema1-check.log
          if-no-files-found: warn
