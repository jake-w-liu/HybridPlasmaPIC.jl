name: Whistler allocation diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usable-size:
    name: usable-size Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12.7', '1.13.3']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Instantiate package environment
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.status()'
      - name: Usable-size probe with the CI test flags
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/usable-evidence"
          julia --startup-file=no --check-bounds=yes --depwarn=yes --threads=1,1 --project=. \
            .github/diagnostics/usable_size_probe.jl 2>&1 | tee "$RUNNER_TEMP/usable-evidence/probe.log"
      - name: Preserve probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usable-size-${{ matrix.julia-version }}
          path: ${{ runner.temp }}/usable-evidence
          if-no-files-found: error
